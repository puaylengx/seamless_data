name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # unit tests เท่านั้น — integration tests (ต่อ DB/SSH จริง) ถูก deselect ผ่าน pyproject addopts
      # ไม่มี secret/credential ใดๆ ใน job นี้ และไม่มี step ไหนแตะ production
      - name: Unit tests (pytest)
        run: python -m pytest tests -q
