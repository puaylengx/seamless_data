name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks สแกนทั้ง history ไม่ใช่แค่ HEAD

      # ── secret scanning (G16): fail ถ้ามี credential ใน commit ไหนก็ตามของ PR ──
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # unit tests เท่านั้น — integration tests (ต่อ DB/SSH จริง) ถูก deselect ผ่าน pyproject addopts
      # ไม่มี secret/credential ใดๆ ใน job นี้ และไม่มี step ไหนแตะ production
      - name: Unit tests (pytest)
        run: python -m pytest tests -q

  # ── G14: image ต้อง build ผ่าน (system deps: mdb-tools, ODBC 18) — ไม่ run container, ไม่แตะ DB ──
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push, no run)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: seamless_data:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
