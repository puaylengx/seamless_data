# G22 — สแกน secret ทั้ง git history ทุกสัปดาห์ (PR check ใน ci.yml สแกนเฉพาะ commit ของ PR)
# รันเองได้จาก Actions tab (workflow_dispatch) หลัง merge branch เก่า / rewrite history / ก่อน release
name: Secret scan (full history)

on:
  schedule:
    - cron: "0 1 * * 1"        # ทุกวันจันทร์ 01:00 UTC (08:00 เวลาไทย)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ทุก commit ทุก branch — ไม่ใช่แค่ HEAD

      - name: Fetch all branches and tags
        run: git fetch --all --tags --prune

      - name: Install gitleaks (pinned)
        run: |
          set -eux
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --log-opts=--all = ทุก ref (branch/tag) เหมือนที่รันในเครื่องตอน G16 (76 commits, 0 leaks)
      - name: gitleaks over every commit on every ref
        run: ./gitleaks git . --log-opts="--all" --redact=100 --report-format sarif --report-path gitleaks-full.sarif --exit-code 1

      - name: Upload report (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-full-history-report
          path: gitleaks-full.sarif
          retention-days: 30
